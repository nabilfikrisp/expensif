name: expensif-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expensif_dev
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: expensif_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensif_dev -d expensif_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
