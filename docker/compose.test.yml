name: expensif-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expensif_test
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_DB: expensif_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensif_test -d expensif_test"]
      interval: 2s
      timeout: 5s
      retries: 15
